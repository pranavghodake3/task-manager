# version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - '5000:5000'
    depends_on:
      - db
    env_file:
      - path: ./backend/.env
        required: true
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules
  
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend
    env_file:
      - path: ./frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - path: ./backend/.env
        required: true

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  postgres-data:
